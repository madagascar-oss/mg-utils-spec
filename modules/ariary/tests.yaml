# Shared test vectors for the ariary module. Every language must pass all of them.
# Default function: formatAriary. \u00a0 is a no-break space, \u202f a narrow no-break space.
- fn: formatAriary
  input: 0
  expected: "Ar\u00a00"
- fn: formatAriary
  input: 5
  expected: "Ar\u00a05"
- fn: formatAriary
  input: 999
  expected: "Ar\u00a0999"
  note: 'no separator below 1000'
- fn: formatAriary
  input: 1000
  expected: "Ar\u00a01\u00a0000"
- fn: formatAriary
  input: 1500
  expected: "Ar\u00a01\u00a0500"
  note: 'default: symbol first, no-break spaces between groups'
- fn: formatAriary
  input: 12345
  expected: "Ar\u00a012\u00a0345"
- fn: formatAriary
  input: 100000
  expected: "Ar\u00a0100\u00a0000"
- fn: formatAriary
  input: 2026000
  expected: "Ar\u00a02\u00a0026\u00a0000"
- fn: formatAriary
  input: 999999999999
  expected: "Ar\u00a0999\u00a0999\u00a0999\u00a0999"
- fn: formatAriary
  input: 1000000000000
  expected: "Ar\u00a01\u00a0000\u00a0000\u00a0000\u00a0000"
- fn: formatAriary
  input: 9007199254740991
  expected: "Ar\u00a09\u00a0007\u00a0199\u00a0254\u00a0740\u00a0991"
  note: 'largest amount every port holds exactly (Number.MAX_SAFE_INTEGER)'
- fn: formatAriary
  input: 1500
  args: [{ 'grouping': 'dot' }]
  expected: "Ar\u00a01.500"
  note: 'dot grouping option'
- fn: formatAriary
  input: 1500
  args: [{ 'symbolPosition': 'after' }]
  expected: "1\u00a0500\u00a0Ar"
  note: 'symbol after the amount'
- fn: formatAriary
  input: 2500000
  args: [{ 'grouping': 'dot', 'symbolPosition': 'after' }]
  expected: "2.500.000\u00a0Ar"
- fn: formatAriary
  input: 2500000
  args: [{}]
  expected: "Ar\u00a02\u00a0500\u00a0000"
  note: 'empty options use the defaults'
- fn: formatAriary
  input: -1
  error: OUT_OF_RANGE
  note: 'negative amounts are not supported'
- fn: formatAriary
  input: 1.5
  expected: "Ar\u00a01,5"
  note: 'decimals follow a comma'
- fn: formatAriary
  input: 1500.5
  expected: "Ar\u00a01\u00a0500,5"
- fn: formatAriary
  input: 0.25
  args: [{ 'symbolPosition': 'after' }]
  expected: "0,25\u00a0Ar"
- fn: formatAriary
  input: 1234567.89
  args: [{ 'grouping': 'dot' }]
  expected: "Ar\u00a01.234.567,89"
  note: 'dot grouping keeps the decimal comma'
- fn: formatAriary
  input: 1234.5678
  expected: "Ar\u00a01\u00a0234,5678"
  note: 'decimals are not grouped, rounded or padded'
- fn: formatAriary
  input: 0.0000001
  expected: "Ar\u00a00,0000001"
  note: 'no exponent notation'
- fn: formatAriary
  input: .nan
  error: INVALID_TYPE
- fn: formatAriary
  input: .inf
  error: INVALID_TYPE
- fn: formatAriary
  input: '1500'
  error: INVALID_TYPE
- fn: formatAriary
  input: 1500.5
  args: [{ 'grouping': 'comma', 'decimal': 'dot' }]
  expected: "Ar\u00a01,500.5"
  note: 'opt-in for another convention'
- fn: formatAriary
  input: 1500.5
  args: [{ 'decimal': 'dot' }]
  expected: "Ar\u00a01\u00a0500.5"
- fn: formatAriary
  input: 1500
  args: [{ 'grouping': 'comma' }]
  error: INVALID_TYPE
  note: 'grouping comma clashes with the default decimal comma'
- fn: formatAriary
  input: 1500
  args: [{ 'grouping': 'dot', 'decimal': 'dot' }]
  error: INVALID_TYPE
- fn: formatAriary
  input: 1500
  args: [{ 'grouping': 'semicolon' }]
  error: INVALID_TYPE
- fn: formatAriary
  input: 1500
  args: [{ 'decimal': 'semicolon' }]
  error: INVALID_TYPE
- fn: formatAriary
  input: 1500
  args: [{ 'symbolPosition': 'middle' }]
  error: INVALID_TYPE
- fn: parseAriary
  input: 'Ar 1 500'
  expected: 1500
- fn: parseAriary
  input: "Ar\u00a01\u00a0500"
  expected: 1500
  note: 'output of formatAriary reads back'
- fn: parseAriary
  input: '1 500 Ar'
  expected: 1500
- fn: parseAriary
  input: '1.500 Ar'
  expected: 1500
  note: 'dot grouping'
- fn: parseAriary
  input: '1500'
  expected: 1500
  note: 'no separator'
- fn: parseAriary
  input: 'MGA 1 500'
  expected: 1500
  note: 'ISO code'
- fn: parseAriary
  input: '1 500 Ariary'
  expected: 1500
- fn: parseAriary
  input: 'ar 2 000'
  expected: 2000
  note: 'currency words are case-insensitive'
- fn: parseAriary
  input: 'Ar1500'
  expected: 1500
- fn: parseAriary
  input: '  Ar 2 000  '
  expected: 2000
  note: 'surrounding spaces are ignored'
- fn: parseAriary
  input: "1\u202f000\u202f000 Ar"
  expected: 1000000
  note: 'narrow no-break spaces'
- fn: parseAriary
  input: '0'
  expected: 0
- fn: parseAriary
  input: 'Ar 999 999 999 999'
  expected: 999999999999
- fn: parseAriary
  input: '1,500'
  expected: 1.5
  note: 'a comma is the decimal separator, never a thousand separator'
- fn: parseAriary
  input: '1 500,50 Ar'
  expected: 1500.5
- fn: parseAriary
  input: 'Ar 0,5'
  expected: 0.5
- fn: parseAriary
  input: "Ar\u00a01\u00a0500,5"
  expected: 1500.5
  note: 'decimal output of formatAriary reads back'
- fn: parseAriary
  input: '1.234.567,89'
  expected: 1234567.89
- fn: parseAriary
  input: '1.5'
  error: INVALID_FORMAT
  note: 'by default a dot is never a decimal point'
- fn: parseAriary
  input: '1,500.50'
  args: [{ 'grouping': 'comma', 'decimal': 'dot' }]
  expected: 1500.5
  note: 'text in another convention, said so by the caller'
- fn: parseAriary
  input: '1,500'
  args: [{ 'grouping': 'comma', 'decimal': 'dot' }]
  expected: 1500
- fn: parseAriary
  input: 'Ar 1.5'
  args: [{ 'decimal': 'dot' }]
  expected: 1.5
- fn: parseAriary
  input: '1.500,5'
  args: [{ 'grouping': 'dot' }]
  expected: 1500.5
- fn: parseAriary
  input: "1\u00a0500"
  args: [{ 'grouping': 'space' }]
  expected: 1500
  note: 'space grouping takes every space'
- fn: parseAriary
  input: '1 500'
  args: [{ 'grouping': 'dot' }]
  error: INVALID_FORMAT
  note: 'only the chosen grouping'
- fn: parseAriary
  input: '1,500'
  args: [{ 'grouping': 'comma' }]
  error: INVALID_TYPE
  note: 'grouping and decimal must differ'
- fn: parseAriary
  input: '1 500'
  args: [{ 'symbolPosition': 'after' }]
  error: INVALID_TYPE
  note: 'reading has no symbolPosition option'
- fn: parseAriary
  input: '1 500'
  args: [null]
  error: INVALID_TYPE
- fn: parseAriary
  input: '1 500.50'
  error: INVALID_FORMAT
- fn: parseAriary
  input: '1,'
  error: INVALID_FORMAT
  note: 'no digit after the comma'
- fn: parseAriary
  input: ',5'
  error: INVALID_FORMAT
  note: 'no digit before the comma'
- fn: parseAriary
  input: '1,5,0'
  error: INVALID_FORMAT
  note: 'one decimal comma at most'
- fn: parseAriary
  input: '1,5 00'
  error: INVALID_FORMAT
  note: 'decimals are not grouped'
- fn: parseAriary
  input: '1 50'
  error: INVALID_FORMAT
  note: 'groups after the first have three digits'
- fn: parseAriary
  input: '1.000 000'
  error: INVALID_FORMAT
  note: 'mixed separators'
- fn: parseAriary
  input: '1.500,00'
  expected: 1500
  note: 'zero decimals read as a whole amount'
- fn: parseAriary
  input: ''
  error: INVALID_FORMAT
- fn: parseAriary
  input: 'Ar'
  error: INVALID_FORMAT
  note: 'symbol without an amount'
- fn: parseAriary
  input: 'abc'
  error: INVALID_FORMAT
- fn: parseAriary
  input: 'Ar 1 500 Ar'
  error: INVALID_FORMAT
  note: 'currency written twice'
- fn: parseAriary
  input: "1 500 \u20ac"
  error: INVALID_FORMAT
  note: 'another currency'
- fn: parseAriary
  input: '-1 500'
  error: INVALID_FORMAT
  note: 'negative amounts are not supported'
- fn: parseAriary
  input: '007'
  error: INVALID_FORMAT
  note: 'leading zeros'
- fn: parseAriary
  input: '1 000 000 000 000'
  expected: 1000000000000
- fn: parseAriary
  input: 'Ar 9 007 199 254 740 991'
  expected: 9007199254740991
- fn: parseAriary
  input: '1500                            '
  expected: 1500
  note: 'exactly 32 characters (the limit) is read'
- fn: parseAriary
  input: '1500                             '
  error: INVALID_FORMAT
  note: '33 characters is over the limit'
- fn: parseAriary
  input: '0000000000000000000000000000000000000000'
  error: INVALID_FORMAT
  note: 'input longer than 32 characters'
- fn: parseAriary
  input: 1500
  error: INVALID_TYPE
  note: 'number, not string'
- fn: ariaryToWords
  input: 0
  expected: 'aotra ariary'
- fn: ariaryToWords
  input: 1
  expected: 'iray ariary'
- fn: ariaryToWords
  input: 21
  expected: 'iraika amby roapolo ariary'
- fn: ariaryToWords
  input: 1500
  expected: 'dimanjato sy arivo ariary'
- fn: ariaryToWords
  input: 20000
  expected: 'roa alina ariary'
- fn: ariaryToWords
  input: 1500.5
  expected: 'dimanjato sy arivo faingo dimy ariary'
- fn: ariaryToWords
  input: 0.25
  expected: 'aotra faingo dimy amby roapolo ariary'
- fn: ariaryToWords
  input: 1000000000000
  expected: 'arivo lavitrisa ariary'
  note: 'words module rule 6: lavitrisa takes any count'
- fn: ariaryToWords
  input: 1999999999999
  expected: 'sivy amby sivifolo sy sivinjato sy sivy arivo sy sivy alina sy sivy hetsy sy sivy amby sivifolo sy sivinjato tapitrisa sy sivy amby sivifolo sy sivinjato sy arivo lavitrisa ariary'
- fn: ariaryToWords
  input: -1
  error: OUT_OF_RANGE
- fn: fmgToAriary
  input: 0
  expected: 0
- fn: fmgToAriary
  input: 5
  expected: 1
  note: '1 Ar = 5 FMG'
- fn: fmgToAriary
  input: 7500
  expected: 1500
- fn: fmgToAriary
  input: 1000000
  expected: 200000
- fn: fmgToAriary
  input: 9007199254740990
  expected: 1801439850948198
  note: 'largest multiple of 5 within Number.MAX_SAFE_INTEGER'
- fn: fmgToAriary
  input: 3
  expected: 0.6
  note: 'francs that do not divide by 5 give decimal ariary'
- fn: fmgToAriary
  input: 7501
  expected: 1500.2
- fn: fmgToAriary
  input: -5
  error: OUT_OF_RANGE
- fn: fmgToAriary
  input: 2.5
  expected: 0.5
  note: 'francs may be decimal'
- fn: fmgToAriary
  input: 0.35
  expected: 0.07
  note: 'exact decimal division, not 0.06999999999999999'
- fn: ariaryToFmg
  input: 0
  expected: 0
- fn: ariaryToFmg
  input: 1
  expected: 5
- fn: ariaryToFmg
  input: 1500
  expected: 7500
- fn: ariaryToFmg
  input: 0.07
  expected: 0.35
  note: 'exact decimal product, not 0.35000000000000003'
- fn: ariaryToFmg
  input: 1500.5
  expected: 7502.5
- fn: ariaryToFmg
  input: 0.2
  expected: 1
- fn: ariaryToFmg
  input: 1801439850948198
  expected: 9007199254740990
  note: 'largest result within Number.MAX_SAFE_INTEGER'
- fn: ariaryToFmg
  input: -1
  error: OUT_OF_RANGE
- fn: formatFmg
  input: 7500
  expected: "Fmg\u00a07\u00a0500"
  note: 'francs use the same layout with the Fmg symbol'
- fn: formatFmg
  input: 7500
  args: [{ 'grouping': 'dot', 'symbolPosition': 'after' }]
  expected: "7.500\u00a0Fmg"
- fn: formatFmg
  input: 7500.5
  expected: "Fmg\u00a07\u00a0500,5"
- fn: formatFmg
  input: -5
  error: OUT_OF_RANGE
