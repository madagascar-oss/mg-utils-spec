- fn: monthName
  input: 1
  args: ['narrow']
  error: INVALID_TYPE
  note: 'unknown width'
- fn: weekdayName
  input: 1
  expected: 'Alatsinainy'
  note: 'ISO 8601: Monday is 1'
- fn: weekdayName
  input: 2
  expected: 'Talata'
- fn: weekdayName
  input: 3
