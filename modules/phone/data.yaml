# Madagascar mobile numbering (+261). Rules in README.md; every entry cites its source.
# Source: ARTEC / OMERT communications to the ITU on the national numbering plan
# (27.VIII.2013, 21.VIII.2013, 21.X.2022), published by the ITU for country code +261.
plan:
  countryCode: '261'
  internationalPrefix: '00'
  trunkPrefix: '0'
  nationalNumberLength: 9
  # +261 37 XX XXX XX — operator code, then 2, 3 and 2 digits.
  grouping: [2, 2, 3, 2]
  source: https://www.itu.int/dms_pub/itu-t/oth/02/02/T020200007F0002PDFF.pdf
  checked: 2026-11-23
operators:
  - id: orange
    name: Orange Madagascar
    prefixes: ['32', '37']
    source: https://www.itu.int/dms_pub/itu-t/oth/02/02/T020200007F0002PDFF.pdf
    checked: 2026-11-23
  - id: airtel
    name: Airtel Madagascar
    prefixes: ['33', '35']
    source: https://www.itu.int/dms_pub/itu-t/oth/02/02/T020200007F0002PDFF.pdf
    checked: 2026-11-23
    # 35 is not in the ITU filing yet; numbers on sale since 22 June 2026.
    extraSources:
      - about: prefix 35
        source: https://techafricanews.com/2026/06/22/airtel-madagascar-launches-new-035-prefix-to-support-network-growth/
        checked: 2026-11-26
  - id: yas
    name: Yas Madagascar
    prefixes: ['34', '38']
    source: https://www.itu.int/dms_pub/itu-t/oth/02/02/T020200007F0002PDFF.pdf
    checked: 2026-11-23
    # Telma (Telecom Malagasy) until 26 November 2024. The ITU filing still says Telma.
    extraSources:
      - about: name Yas Madagascar, formerly Telma
        source: https://www.lexpress.mg/2024/11/telephonie-mobile-telma-change-de-nom.html
        checked: 2026-11-26
  - id: blueline
    name: Blueline
    prefixes: ['39']
    source: https://www.itu.int/dms_pub/itu-t/oth/02/02/T020200007F0002PDFF.pdf
    checked: 2026-11-23
