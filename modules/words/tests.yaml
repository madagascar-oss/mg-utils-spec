- input: 12
  expected: "roa ambin'ny folo"
  note: 'dictionary table'
- input: 15
  expected: "dimy ambin'ny folo"
- input: 19
  expected: "sivy ambin'ny folo"
- input: 20
  expected: 'roapolo'
