  note: negative numbers are not supported
- input: 1000000000000
  error: OUT_OF_RANGE
  note: above limits.max
- input: 1.5
  error: INVALID_TYPE
  note: only integers have number words
- input: '12'
  error: INVALID_TYPE
  note: strings are not parsed
- input: null
  error: INVALID_TYPE
- input: .nan
  error: INVALID_TYPE
- input: .inf
  error: INVALID_TYPE
