# Shared test vectors for numberToWords. Every language must pass all of them.
# Notes cite the dictionary row when the exact phrase is attested; other rows apply the rules in README.md.
- input: 0
  expected: 'aotra'
  note: 'dictionary table'
- input: 1
  expected: 'iray'
- input: 2
  expected: 'roa'
- input: 5
  expected: 'dimy'
- input: 9
  expected: 'sivy'
- input: 10
  expected: 'folo'
- input: 11
  expected: "iraika ambin'ny folo"
