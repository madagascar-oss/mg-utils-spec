  expected: 'roa tapitrisa'
- input: 10000000
  expected: 'folo tapitrisa'
- input: 21000000
  expected: 'iraika amby roapolo tapitrisa'
- input: 200000000
  expected: 'roanjato tapitrisa'
  note: 'dictionary table'
- input: 280000000
  expected: 'valopolo sy roanjato tapitrisa'
  note: "the dictionary entry tapitrisa writes 'valopolo amby roanjato tapitrisa'; the data follows rule 4 (see Recorded disagreements)"
- input: 201000000
  expected: 'iray sy roanjato tapitrisa'
- input: 999999999
  expected: 'sivy amby sivifolo sy sivinjato sy sivy arivo sy sivy alina sy sivy hetsy sy sivy amby sivifolo sy sivinjato tapitrisa'
- input: 1000000000
  expected: 'lavitrisa'
  note: 'dictionary table'
- input: 1000000001
  expected: 'iray sy lavitrisa'
- input: 2000000000
  expected: 'roa lavitrisa'
  note: 'dictionary table'
- input: 12000000000
  expected: "roa ambin'ny folo lavitrisa"
- input: 999999999999
  expected: 'sivy amby sivifolo sy sivinjato sy sivy arivo sy sivy alina sy sivy hetsy sy sivy amby sivifolo sy sivinjato tapitrisa sy sivy amby sivifolo sy sivinjato lavitrisa'
- input: -1
