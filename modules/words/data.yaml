# Groups above 999. A count of one is bare only for arivo ('arivo', 'iray alina', 'iray tapitrisa').
# maxCount: largest multiplier read before the word (9 → 'sivy alina'; 999 → '... tapitrisa').
# The largest group has no maxCount: it takes any count, written with every rule
# (1999 × 10⁹ → 'sivy amby sivifolo sy sivinjato sy arivo lavitrisa').
scales:
  - value: 1000
    word: arivo
    maxCount: 9
    source: https://malagasyword.org/bins/teny2/arivo
    checked: 2026-11-23
  - value: 10000
    word: alina
    maxCount: 9
    source: https://malagasyword.org/bins/teny2/alina
    checked: 2026-11-23
  - value: 100000
    word: hetsy
    maxCount: 9
    source: https://malagasyword.org/bins/teny2/hetsy
    checked: 2026-11-23
  - value: 1000000
    word: tapitrisa
    maxCount: 999
    source: https://malagasyword.org/bins/teny2/tapitrisa
    checked: 2026-11-23
  - value: 1000000000
    word: lavitrisa
    source: https://malagasyword.org/bins/teny2/lavitrisa
    checked: 2026-11-23
# Traditional system (rule 12): one name per power of ten, each taking a single digit 1–9.
# 10³–10⁶ are the standard words; 10⁷–10¹⁵ are attested (Languages and Numbers, quoting Assimil).
# derived: built by the source's own rule, '<name>faharoa' = <name> × 10⁷, as phanisana does;
# spelled from the Assimil names. The largest entry also takes 1–9, so the system ends at 10¹⁹ − 1.
traditionalScales:
  - value: 1000
    word: arivo
    source: https://malagasyword.org/bins/teny2/arivo
    checked: 2026-11-23
  - value: 10000
