# Groups above 999. A count of one is bare only for arivo ('arivo', 'iray alina', 'iray tapitrisa').
# maxCount: largest multiplier read before the word (9 → 'sivy alina'; 999 → '... tapitrisa').
# A count is one phrase joined by amby (rule 4): 280 000 000 → 'valopolo amby roanjato tapitrisa'.
scales:
  - value: 1000
    word: arivo
    maxCount: 9
    source: https://malagasyword.org/bins/teny2/arivo
    checked: 2026-11-23
  - value: 10000
    word: alina
    maxCount: 9
    source: https://malagasyword.org/bins/teny2/alina
    checked: 2026-11-23
  - value: 100000
    word: hetsy
    maxCount: 9
    source: https://malagasyword.org/bins/teny2/hetsy
    checked: 2026-11-23
  - value: 1000000
    word: tapitrisa
    maxCount: 999
    source: https://malagasyword.org/bins/teny2/tapitrisa
    checked: 2026-11-23
  - value: 1000000000
    word: lavitrisa
    maxCount: 999
    source: https://malagasyword.org/bins/teny2/lavitrisa
    checked: 2026-11-23
# Rule 6: above lavitrisa, a group word is a compound of the words above, as Assimil names 10⁹
# 'arivo tapitrisa': the word for 10ⁿ (n = 3, 6, 9, 12, …) followed by 'lavitrisa' is 10ⁿ⁺⁹.
# 'arivo lavitrisa' 10¹², 'tapitrisa lavitrisa' 10¹⁵, 'lavitrisa lavitrisa' 10¹⁸,
# 'arivo lavitrisa lavitrisa' 10²¹. Each takes a count of 1–999.
compoundScale:
  word: lavitrisa
  source: https://www.languagesandnumbers.com/how-to-count-in-malagasy/en/mlg/
  checked: 2026-11-27
# Traditional system (rule 12): one name per power of ten, each taking a single digit 1–9.
# 10³–10⁶ are the standard words; 10⁷–10¹⁵ are attested (Languages and Numbers, quoting Assimil).
# derived: built by the source's own rule, '<name>faharoa' = <name> × 10⁷, as phanisana does;
# spelled from the Assimil names. No port's largest input reaches 10¹⁹, so each name takes 1–9.
traditionalScales:
  - value: 1000
    word: arivo
    source: https://malagasyword.org/bins/teny2/arivo
    checked: 2026-11-23
  - value: 10000
