joiners:
  # 11–19 only: 'iraika ambin'ny folo'.
  unitsBeforeTen:
    word: "ambin'ny"
    source: https://www.languagesandnumbers.com/how-to-count-in-malagasy/en/mlg/
    checked: 2026-11-24
  # Units onto 20–90 ('iraika amby roapolo') and anything onto exactly 100 ('dimy amby zato').
  belowThousand:
    word: amby
    source: https://malagasyword.org/bins/teny2/amby
    checked: 2026-11-23
  # Anything onto 200–900 ('dimy sy roanjato') and between groups of 1000 and above
  # ('valo alina sy roa hetsy', 280 000).
  betweenGroups:
    word: sy
    source: https://malagasyword.org/bins/teny2/tapitrisa
    checked: 2026-11-23
# Between the whole part and the decimals: 3.14 → 'telo faingo efatra ambin'ny folo'.
decimalSeparator:
  word: faingo
  source: https://malagasyword.org/bins/teny2/faingo
  checked: 2026-11-26
# No max: each port stops at its largest exact integer (README, Errors).
limits:
  min: 0
