joiners:
  # 11–19 only: 'iraika ambin'ny folo'.
  unitsBeforeTen:
    word: "ambin'ny"
    source: https://www.languagesandnumbers.com/how-to-count-in-malagasy/en/mlg/
    checked: 2026-11-24
  # Inside one phrase below 1000: units onto tens ('iraika amby roapolo') and the part below 100
  # onto the hundreds ('valo amby efapolo amby telonjato', 348, Assimil). A count before a
  # group word is such a phrase ('valopolo amby roanjato tapitrisa', dictionary entry tapitrisa).
  belowThousand:
    word: amby
    source: https://www.languagesandnumbers.com/how-to-count-in-malagasy/en/mlg/
    checked: 2026-11-27
  # Between groups ('valo alina sy roa hetsy', 280 000). In a number of 1000 or more, the
  # hundreds from 200 are a group too ('enina amby valopolo sy dimanjato sy roa arivo', 2 586).
  betweenGroups:
    word: sy
    source: https://www.languagesandnumbers.com/how-to-count-in-malagasy/en/mlg/
    checked: 2026-11-27
# Between the whole part and the decimals: 3.14 → 'telo faingo efatra ambin'ny folo'.
decimalSeparator:
  word: faingo
  source: https://malagasyword.org/bins/teny2/faingo
  checked: 2026-11-26
# Ordinals (rule 14): faha before the cardinal ('fahatelo'), fah before a vowel ('fahefatra',
# 'fahiraika ambin'ny folo'), except 1, which is voalohany.
ordinals:
  first:
    word: voalohany
    source: https://malagasyword.org/bins/teny2/voalohany
    checked: 2026-11-27
  prefix:
    word: faha
    source: https://malagasyword.org/bins/teny2/faha
    checked: 2026-11-27
  prefixBeforeVowel:
    word: fah
    source: https://malagasyword.org/bins/teny2/faha
    checked: 2026-11-27
  vowels: [a, e, i, o, y]
# No max: each port stops at its largest exact integer (README, Errors).
# maxTextLength: longest decimal text read (rule 13), so a parser never scans unbounded input.
limits:
  min: 0
  maxTextLength: 100
  maxWordsLength: 4096
