name: Release

# Merging dev into main releases the spec: tag v<VERSION> and a GitHub release, if not there yet.
# Language repos pin the spec submodule to these tags; Renovate proposes the bump.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag and release VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Spec $tag" --generate-notes
