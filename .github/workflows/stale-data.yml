name: Stale data

on:
  schedule:
    - cron: '0 6 1 * *' # monthly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Open or update the stale-data issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Spec data to re-check (older than 12 months)'
        run: |
          pnpm -s stale-data > report.md
          cat report.md
          grep -q -- '- \[ \]' report.md || exit 0
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
          else
            gh issue create --title "$TITLE" --body-file report.md --label data --label no-code --label "good first issue"
          fi
