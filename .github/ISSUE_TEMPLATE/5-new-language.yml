name: New language port
description: Port mg-utils to Python, Go, Java…
labels: [feature, needs-decision, triage]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: textarea
    id: maintainer
    attributes:
      label: Who will maintain it
      description: A port needs a named maintainer who will review its PRs.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Minimum versions
      description: Only versions still maintained upstream.
    validations:
      required: true
