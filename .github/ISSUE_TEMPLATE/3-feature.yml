name: Feature request
description: A new helper in an existing module
labels: [feature, triage]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - phone
        - words
        - ariary (planned)
        - date (planned)
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you building, and what is missing?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example inputs and outputs
      description: These become the first test vectors.
      placeholder: |
        formatPhoneNumber('0341234567', 'rfc3966') → 'tel:+261-34-12-345-67'
    validations:
      required: true
