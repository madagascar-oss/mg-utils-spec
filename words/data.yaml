# Groups above 999. A count of one is the bare word ('arivo', not 'iray arivo').
# maxCount: largest multiplier read before the word (9 → 'sivy alina'; 999 → '... tapitrisa').
scales:
  - value: 1000
    word: arivo
    maxCount: 9
    source: https://malagasyword.org/bins/teny2/arivo
    checked: 2026-11-23
  - value: 10000
    word: alina
    maxCount: 9
    source: https://malagasyword.org/bins/teny2/alina
    checked: 2026-11-23
  - value: 100000
    word: hetsy
    maxCount: 9
    source: https://malagasyword.org/bins/teny2/hetsy
    checked: 2026-11-23
  - value: 1000000
    word: tapitrisa
    maxCount: 999
    source: https://malagasyword.org/bins/teny2/tapitrisa
    checked: 2026-11-23
  - value: 1000000000
    word: lavitrisa
    maxCount: 999
    source: https://malagasyword.org/bins/teny2/lavitrisa
    checked: 2026-11-23
joiners:
  # 11–19 only: 'iraika ambin' ny folo'.
  unitsBeforeTen:
    word: "ambin' ny"
    source: https://malagasyword.org/bins/teny2/amby
    checked: 2026-11-23
  # Any other addition below 1000: 'iraika amby roapolo', 'dimy amby zato', 'telo amby valopolo'.
  belowThousand:
    word: amby
    source: https://malagasyword.org/bins/teny2/amby
    checked: 2026-11-23
  # Between groups of 1000 and above: 'valo alina sy roa hetsy' (280 000).
  betweenGroups:
    word: sy
    source: https://malagasyword.org/bins/teny2/tapitrisa
    checked: 2026-11-23
limits:
  min: 0
  max: 999999999999
